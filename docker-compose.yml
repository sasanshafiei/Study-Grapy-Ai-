# Shared by the M3 worker services below.
x-ingestion-worker: &ingestion-worker
  build: ./services/core-api
  environment:
    DATABASE_URL: postgresql+psycopg://studygraph:studygraph@db:5432/studygraph
    REDIS_URL: redis://redis:6379/0
    UPLOAD_DIR: /data/uploads
    ENVIRONMENT: development
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started
  volumes:
    - ./services/core-api:/app
    - uploads:/data/uploads

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: studygraph
      POSTGRES_PASSWORD: studygraph
      POSTGRES_DB: studygraph
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studygraph"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    # No host port. Every service reaches Redis over the Compose network as
    # redis:6379, and the M3 workers act on whatever this broker hands them, so
    # it must not be reachable from outside without authentication. If you need
    # it from the host (e.g. core-api run outside Docker), publish it on loopback
    # only, in an untracked override file:
    #   services: { redis: { ports: ["127.0.0.1:6379:6379"] } }

  core-api:
    build: ./services/core-api
    environment:
      DATABASE_URL: postgresql+psycopg://studygraph:studygraph@db:5432/studygraph
      REDIS_URL: redis://redis:6379/0
      AI_SERVICE_URL: http://ai-service:8000
      ENVIRONMENT: development
      UPLOAD_DIR: /data/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./services/core-api:/app
      # Uploaded originals. Persistent, outside the code mount, never served
      # statically. The M3 worker mounts the same volume.
      - uploads:/data/uploads

  ai-service:
    build: ./services/ai-service
    ports:
      - "8001:8000"
    volumes:
      - ./services/ai-service:/app

  # --- Asynchronous document processing (M3, docs/document-processing.md) --------------
  # Same image and code as core-api. They never run migrations: each worker
  # checks the schema revision at start and exits (status 78) if it is not the
  # one its code needs. No ports. Redis above is not published on the host;
  # keep it that way, or loopback-only (see "Broker security" in the docs).
  worker:
    <<: *ingestion-worker
    command: >-
      celery -A app.worker worker -Q ingestion.parse -c 2 -P prefork -n parse@%h
      --without-mingle --without-gossip --without-heartbeat -l INFO
    # Longer than the parse task's hard time limit (180 s): a warm shutdown
    # lets the running parse finish instead of leaving it to lease recovery.
    stop_grace_period: 210s

  worker-maintenance:
    <<: *ingestion-worker
    # Dispatch, lease recovery and file reconciliation, on their own queue and
    # processes so that long parses can never starve them.
    command: >-
      celery -A app.worker worker -Q ingestion.maintenance -c 2 -P prefork -n maintenance@%h
      --without-mingle --without-gossip --without-heartbeat -l INFO
    stop_grace_period: 130s

  # AI indexing (M4, docs/ai-indexing-integration.md). Consumes only the index
  # queue; it needs the database, Redis and the AI service, never the upload
  # volume. INDEXING_ENABLED stays false until AI-1 ships a compatible,
  # non-mock service and AI_SERVICE_TOKEN is provisioned: while false it
  # claims nothing, and the mock ai-service above is refused anyway.
  worker-index:
    build: ./services/core-api
    command: >-
      celery -A app.worker worker -Q ingestion.index -c 2 -P prefork -n index@%h
      --without-mingle --without-gossip --without-heartbeat -l INFO
    environment:
      DATABASE_URL: postgresql+psycopg://studygraph:studygraph@db:5432/studygraph
      REDIS_URL: redis://redis:6379/0
      AI_SERVICE_URL: http://ai-service:8000
      INDEXING_ENABLED: "false"
      ENVIRONMENT: development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./services/core-api:/app
    # Longer than the index task's hard time limit (270 s).
    stop_grace_period: 300s

  beat:
    build: ./services/core-api
    # Exactly one Beat. Its schedule state is disposable (interval schedules),
    # so it lives in the container's /tmp. It needs neither the database nor
    # the upload volume.
    command: celery -A app.worker beat -s /tmp/celerybeat-schedule --pidfile= -l INFO
    environment:
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
    depends_on:
      redis:
        condition: service_started
    volumes:
      - ./services/core-api:/app

volumes:
  pgdata:
  uploads:
