# Shared by the M3 worker services below.
x-ingestion-worker: &ingestion-worker
  build: ./services/core-api
  environment:
    DATABASE_URL: postgresql+psycopg://studygraph:studygraph@db:5432/studygraph
    REDIS_URL: redis://redis:6379/0
    UPLOAD_DIR: /data/uploads
    ENVIRONMENT: development
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started
  volumes:
    - ./services/core-api:/app
    - uploads:/data/uploads

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: studygraph
      POSTGRES_PASSWORD: studygraph
      POSTGRES_DB: studygraph
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studygraph"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    # No host port. Every service reaches Redis over the Compose network as
    # redis:6379, and the M3 workers act on whatever this broker hands them, so
    # it must not be reachable from outside without authentication. If you need
    # it from the host (e.g. core-api run outside Docker), publish it on loopback
    # only, in an untracked override file:
    #   services: { redis: { ports: ["127.0.0.1:6379:6379"] } }

  core-api:
    build: ./services/core-api
    environment:
      DATABASE_URL: postgresql+psycopg://studygraph:studygraph@db:5432/studygraph
      REDIS_URL: redis://redis:6379/0
      AI_SERVICE_URL: http://ai-service:8000
      ENVIRONMENT: development
      UPLOAD_DIR: /data/uploads
      # M8: the deterministic dashboard is on; analytics and study telemetry stay off until approved.
      DASHBOARD_ENABLED: "true"
      ANALYTICS_ENABLED: "false"
      STUDY_EVENTS_ENABLED: "false"
      AI_RECOMMENDATIONS_ENABLED: "false"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready', timeout=4).close()"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./services/core-api:/app
      # Uploaded originals. Persistent, outside the code mount, never served
      # statically. The M3 worker mounts the same volume.
      - uploads:/data/uploads

  ai-service:
    build:
      context: .
      dockerfile: services/ai-service/Dockerfile
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      # AI-2 mastery provider (services/ai-service/app/mastery). "fixture" keeps the mock;
      # "real" needs MASTERY_STATE_EPOCH, the same epoch CE pins (docs/ai2-mastery-provider.md).
      MASTERY_PROVIDER: ${MASTERY_PROVIDER:-fixture}
      MASTERY_STATE_EPOCH: ${MASTERY_STATE_EPOCH:-}
      MASTERY_STATE_PATH: /data/mastery/state.sqlite3
    ports:
      - "8001:8000"
    volumes:
      - ./services/ai-service:/app
      - ./contracts/ai-service.openapi.yaml:/contracts/ai-service.openapi.yaml:ro
      - ./contracts/fixtures:/contracts/fixtures:ro
      # Learner model state: must persist, or CE detects lost state and blocks delivery.
      - ai_mastery_state:/data/mastery

  # --- Asynchronous document processing (M3, docs/document-processing.md) --------------
  # Same image and code as core-api. They never run migrations: each worker
  # checks the schema revision at start and exits (status 78) if it is not the
  # one its code needs. No ports. Redis above is not published on the host;
  # keep it that way, or loopback-only (see "Broker security" in the docs).
  worker:
    <<: *ingestion-worker
    command: >-
      celery -A app.worker worker -Q ingestion.parse -c 2 -P prefork -n parse@%h
      --without-mingle --without-gossip --without-heartbeat -l INFO
    # Longer than the parse task's hard time limit (180 s): a warm shutdown
    # lets the running parse finish instead of leaving it to lease recovery.
    stop_grace_period: 210s

  worker-maintenance:
    <<: *ingestion-worker
    # Dispatch, lease recovery and file reconciliation, on their own queue and
    # processes so that long parses can never starve them. M8 adds two ticks here,
    # both database-only (no upstream call): mastery recovery/dispatch and the
    # analytics releases / study-event retention.
    environment:
      DATABASE_URL: postgresql+psycopg://studygraph:studygraph@db:5432/studygraph
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /data/uploads
      ENVIRONMENT: development
      MASTERY_DELIVERY_ENABLED: "false"
      ANALYTICS_ENABLED: "false"
    command: >-
      celery -A app.worker worker -Q ingestion.maintenance -c 2 -P prefork -n maintenance@%h
      --without-mingle --without-gossip --without-heartbeat -l INFO
    stop_grace_period: 130s

  # AI indexing (M4, docs/ai-indexing-integration.md). Consumes only the index
  # queue; it needs the database, Redis and the AI service, never the upload
  # volume. INDEXING_ENABLED stays false until AI-1 ships a compatible,
  # non-mock service and AI_SERVICE_TOKEN is provisioned: while false it
  # claims nothing, and the mock ai-service above is refused anyway.
  worker-index:
    build: ./services/core-api
    command: >-
      celery -A app.worker worker -Q ingestion.index -c 2 -P prefork -n index@%h
      --without-mingle --without-gossip --without-heartbeat -l INFO
    environment:
      DATABASE_URL: postgresql+psycopg://studygraph:studygraph@db:5432/studygraph
      REDIS_URL: redis://redis:6379/0
      AI_SERVICE_URL: http://ai-service:8000
      INDEXING_ENABLED: "false"
      ENVIRONMENT: development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./services/core-api:/app
    # Longer than the index task's hard time limit (270 s).
    stop_grace_period: 300s

  # External harvesting (M6, docs/external-harvesting.md). Consumes only the
  # harvest queue, one slice at a time (concurrency 1: the provider budget and
  # courtesy spacing assume a single serial requester per worker). Needs the
  # database and Redis; never the upload volume, no ports. HARVEST_ENABLED stays
  # false: while false it claims nothing and sends nothing. Activating it needs
  # more than this flag (docs/external-harvesting.md, section 10): the SAME flag
  # on worker-maintenance (schedules and dispatches runs), HARVEST_USER_AGENT
  # with a real contact, an enabled provider source, an opted-in course,
  # approved queries, and - outside this file - an infrastructure egress
  # restriction for this service only (TCP 443 to the provider). Compose does
  # not provide that restriction: the default network gives this container
  # general outbound access.
  worker-harvest:
    build: ./services/core-api
    command: >-
      celery -A app.worker worker -Q harvest.run -c 1 -P prefork -n harvest@%h
      --without-mingle --without-gossip --without-heartbeat -l INFO
    environment:
      DATABASE_URL: postgresql+psycopg://studygraph:studygraph@db:5432/studygraph
      REDIS_URL: redis://redis:6379/0
      HARVEST_ENABLED: "false"
      ENVIRONMENT: development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./services/core-api:/app
    # Longer than the harvest task's hard time limit (270 s).
    stop_grace_period: 300s

  # Mastery delivery (M8, docs/ai-mastery-integration.md). Consumes only the
  # mastery queue, so slow model requests never block ingestion or harvest
  # maintenance. Needs the database, Redis and the AI service; never the upload
  # volume, no ports. MASTERY_DELIVERY_ENABLED stays false: while false it claims
  # and sends nothing, and the mock ai-service is refused anyway (mock must be
  # literally false). Activation needs the same flag on worker-maintenance,
  # AI_SERVICE_TOKEN and the complete MASTERY_* pins (docs, "Activation").
  worker-mastery:
    build: ./services/core-api
    command: >-
      celery -A app.worker worker -Q mastery.deliver -c 2 -P prefork -n mastery@%h
      --without-mingle --without-gossip --without-heartbeat -l INFO
    environment:
      DATABASE_URL: postgresql+psycopg://studygraph:studygraph@db:5432/studygraph
      REDIS_URL: redis://redis:6379/0
      AI_SERVICE_URL: http://ai-service:8000
      MASTERY_DELIVERY_ENABLED: "false"
      ENVIRONMENT: development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./services/core-api:/app
    # Longer than the mastery task's hard time limit (75 s).
    stop_grace_period: 105s

  beat:
    build: ./services/core-api
    # Exactly one Beat. Its schedule state is disposable (interval schedules),
    # so it lives in the container's /tmp. It needs neither the database nor
    # the upload volume.
    command: celery -A app.worker beat -s /tmp/celerybeat-schedule --pidfile= -l INFO
    environment:
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
    depends_on:
      redis:
        condition: service_started
    volumes:
      - ./services/core-api:/app

volumes:
  pgdata:
  uploads:
  ai_mastery_state:
