# Alembic configuration for core-api. See docs/database-migrations.md.
#
# There is deliberately no sqlalchemy.url in this file. migrations/env.py reads
# DATABASE_URL from the environment and refuses to run without it (no .env or
# default fallback), so no credentials live here. Run Alembic inside the
# core-api container:
#
#     docker compose exec core-api alembic upgrade head

[alembic]
script_location = %(here)s/migrations

# Makes `import app...` work from env.py regardless of the working directory.
prepend_sys_path = %(here)s
path_separator = os

# Revision files are named <revision id>_<slug>.py. Pass a sequential id when
# creating one: alembic revision --autogenerate --rev-id 0002 -m "add ingestion jobs"
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
